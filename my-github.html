<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub 링크 센터</title>
    <link rel="stylesheet" href="css/my-github.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <span class="github-logo">🐙</span>
                내 GitHub 바로가기
            </h1>
            <p class="description">자주 방문하는 GitHub 프로필과 저장소를 빠르게 열어보세요</p>
            <!-- 공통 메뉴가 여기에 동적으로 로드됩니다 -->
        </header>
        
        <main>
            <div class="documents">
                <div class="document-card">
                    <div class="document-icon">
                        <i class="fab fa-github"></i>
                    </div>
                    <h3 class="document-title">GitHub 프로필</h3>
                    <p class="document-info">내 활동, 핀 고정 레포지토리, 팔로워를 확인하세요</p>
                    <a href="https://github.com/dev-jm-1024" class="download-btn" target="_blank" rel="noopener noreferrer">이동하기</a>
                </div>

                <div class="document-card">
                    <div class="document-icon">
                        <i class="fas fa-book"></i>
                    </div>
                    <h3 class="document-title">pdf-download-page 저장소</h3>
                    <p class="document-info">현재 사이트의 소스 코드와 정적 리소스를 확인하세요</p>
                    <a href="https://github.com/dev-jm-1024/pdf-download-page" class="download-btn" target="_blank" rel="noopener noreferrer">이동하기</a>
                </div>

                <div class="document-card">
                    <div class="document-icon">
                        <i class="fas fa-folder-open"></i>
                    </div>
                    <h3 class="document-title">모든 저장소 보기</h3>
                    <p class="document-info">공개 저장소 목록을 한 번에 살펴보세요</p>
                    <a href="https://github.com/dev-jm-1024?tab=repositories" class="download-btn" target="_blank" rel="noopener noreferrer">이동하기</a>
                </div>

                <div class="document-card">
                    <div class="document-icon">
                        <i class="fas fa-star"></i>
                    </div>
                    <h3 class="document-title">Stars</h3>
                    <p class="document-info">즐겨찾기한 오픈소스 프로젝트를 확인하세요</p>
                    <a href="https://github.com/dev-jm-1024?tab=stars" class="download-btn" target="_blank" rel="noopener noreferrer">이동하기</a>
                </div>
            </div>
        </main>
        
        <footer>
            <p>© 2025 My GitHub 링크 센터. 모든 권리 보유.</p>
        </footer>
    </div>
    <script src="js/my-github.js"></script>
    <script src="js/menu-loader.js"></script>
</body>
</html>
